spring:
  rabbitmq:
    host: suitcase-app-rabbitmq-1  # контейнер RabbitMQ во внутренней сети suitcase-network
    port: 5672
    username: admin
    password: HyEaPMAr
    virtual-host: /app
  boot:
    admin:
      client:
        url: http://suitcase-admin-container:8085
        instance:
          service-base-url: http://suitcase-notification-container:8082
  application:
    name: suitcase-notification

  # Яндекс Почта: smtp.yandex.ru, 465, SSL (пароль — «пароль приложения» в настройках Яндекса)
  mail:
    host: ${MAIL_HOST:smtp.yandex.ru}
    port: ${MAIL_PORT:465}
    username: ${MAIL_USERNAME:sorvallsorokin@yandex.ru}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: ${MAIL_STARTTLS:false}
          ssl:
            enable: ${MAIL_SMTP_SSL:true}
          # Яндекс 465 + JavaMail; порт должен совпадать с spring.mail.port
          socketFactory:
            port: ${MAIL_PORT:465}
            class: javax.net.ssl.SSLSocketFactory
          socketFactoryFallback: false

management:
  endpoints:
    web:
      exposure:
        include: "*"


server:
  port: 8082


notification:
  rabbit:
    # Имя очереди в RabbitMQ (менять нельзя — совместимость с паблишерами)
    incoming-queue: telegram.queue
  email:
    to: sorvall@mail.ru
    subject: Suitcase notification
