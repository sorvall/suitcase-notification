name: Build and Deploy Gateway

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Copy JAR to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "build/libs/suitcase-notification-0.0.1-SNAPSHOT.jar"
          target: "/root/suitcase-app/notification"

      - name: Copy Dockerfile to remote server
        uses: appleboy/scp-action@v0.1.4
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          source: "Dockerfile"
          target: "/root/suitcase-app/notification"

      - name: SSH Command to Build and Run Docker Container
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SSH_PASSWORD }}
          script: |
            cd /root/suitcase-app/notification

            # Остановить и удалить старый контейнер, если он существует
            docker stop suitcase-notification-container || true
            docker rm suitcase-notification-container || true

            # Построить новый образ
            docker build -t suitcase-notification .

            # Запустить новый контейнер (в GitHub: Settings → Secrets → MAIL_PASSWORD = пароль приложения Яндекса)
            docker run -d -p 8082:8082 --name suitcase-notification-container --network suitcase-network \
              -e "MAIL_PASSWORD=${{ secrets.MAIL_PASSWORD }}" \
              suitcase-notification